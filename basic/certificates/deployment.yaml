# nginx serving HTTPS with the Secret my-app-tls from certificate-server.yaml.
# Mount the Secret as a directory, never with subPath: subPath mounts don't receive renewed files.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
        - name: nginx
          image: nginx:1.28.0
          env:
            # One nginx worker per CPU of the limit, not per CPU of the node.
            - name: NGINX_ENTRYPOINT_WORKER_PROCESSES_AUTOTUNE
              value: "1"
          ports:
            - containerPort: 8443
              name: https
          readinessProbe:
            tcpSocket:
              port: https
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          volumeMounts:
            - name: tls
              mountPath: /etc/nginx/tls
              readOnly: true
            - name: config
              mountPath: /etc/nginx/conf.d
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: my-app-tls
        - name: config
          configMap:
            name: my-app-nginx
