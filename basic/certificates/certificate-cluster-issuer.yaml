# A self-signed certificate in one step, from the host's ClusterIssuer selfsigned-cluster-issuer,
# for a hop that nothing verifies, such as ingress-nginx to a pod with backend-protocol HTTPS.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: my-app-backend-tls
spec:
  secretName: my-app-backend-tls
  dnsNames:
    - my-app
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    # The host's ClusterIssuer: the plugin passes the reference on unchanged.
    name: selfsigned-cluster-issuer
    kind: ClusterIssuer
