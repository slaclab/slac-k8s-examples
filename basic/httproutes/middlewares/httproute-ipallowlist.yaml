# A route without login, open only to SLAC networks through the slac-only Middleware
# (middleware-ipallowlist.yaml).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: my-app
spec:
  hostnames:
    - my-app.slac.stanford.edu
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        # A rule-level filter, in the first or second position. The Middleware lives in the
        # route's namespace; the platform renames the reference on the way to the gateway.
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: slac-only
      backendRefs:
        - name: my-app
          port: 8080
