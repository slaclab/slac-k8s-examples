# The application under https://my-app.slac.stanford.edu/my-app/, with two Middlewares: the
# prefix is stripped (middleware-strip-prefix.yaml) and security headers are added
# (middleware-headers.yaml). Two Middlewares is the most one rule can use.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: my-app
spec:
  hostnames:
    - my-app.slac.stanford.edu
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /my-app
      filters:
        # The platform renames Middleware references only in the first two filters of a rule.
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: strip-prefix
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: security-headers
      backendRefs:
        - name: my-app
          port: 8080
