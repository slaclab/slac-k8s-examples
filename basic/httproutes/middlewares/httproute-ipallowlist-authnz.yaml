# SLAC networks only, and an S3DF login. The platform appends the s3df-authnz filter after
# slac-only, so clients outside SLAC get 403 before they reach the login page.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: my-app
  annotations:
    auth.sdf.slac.stanford.edu/required: "true"
spec:
  hostnames:
    - my-app.slac.stanford.edu
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: slac-only
        # Don't add s3df-authnz here: the platform adds it as the last filter.
      backendRefs:
        - name: my-app
          port: 8080
