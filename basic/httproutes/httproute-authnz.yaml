# Login required: any authenticated S3DF user may reach the app.
# Prefix: auth.sdf.slac.stanford.edu in prod, auth-dev.sdf.slac.stanford.edu in dev.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: my-app
  annotations:
    # Exactly "true". Anything else leaves the route unprotected.
    auth.sdf.slac.stanford.edu/required: "true"
spec:
  hostnames:
    - my-app.slac.stanford.edu
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: my-app
          port: 8080
