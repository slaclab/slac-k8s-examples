# Login and groups as in httproute-authnz-groups.yaml, and the app also receives the user's own
# Dex token in X-Auth-Bearer, so it can call other S3DF services as that user.
#
# Only turn this on if the app needs it: the app, and anything that logs its request headers,
# then holds every visiting user's live token, which other services accept until it expires.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: my-app
  annotations:
    auth.sdf.slac.stanford.edu/required: "true"
    auth.sdf.slac.stanford.edu/required-groups: "rubin:*"
    auth.sdf.slac.stanford.edu/forward-user-credential: "true"
spec:
  hostnames:
    - my-app.slac.stanford.edu
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: my-app
          port: 8080
