# A public route: no login. Write it inside your vcluster with hostnames and backendRefs only;
# the platform attaches it to the gateway (see README.md).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: my-app
spec:
  hostnames:
    - my-app.slac.stanford.edu
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: my-app        # your Service, in the same namespace as the route
          port: 8080
