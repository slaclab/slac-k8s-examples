# General-purpose nodes: three replicas spread over nodes, so one node failure stops one replica.
# No tolerations and no nodeSelector: a general workload needs neither.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          # The node name: use it as a topology key, never in a nodeSelector.
          topologyKey: kubernetes.io/hostname
          # Start a replica even when the spread cannot be met, instead of leaving it Pending.
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: my-app
      containers:
        - name: my-app
          image: busybox:1.37.0
          command: [sh, -c, "sleep infinity"]
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 64Mi
