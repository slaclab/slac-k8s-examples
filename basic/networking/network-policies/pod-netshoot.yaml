# A throwaway pod with curl, dig and nc, for testing what your pods can reach.
# Delete it when you are done: kubectl delete pod netshoot -n my-namespace
apiVersion: v1
kind: Pod
metadata:
  name: netshoot
  labels:
    app: netshoot
spec:
  restartPolicy: Never
  containers:
    - name: netshoot
      image: nicolaka/netshoot:v0.13
      command: [sh, -c, "sleep 3600"]
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 200m
          memory: 128Mi
