# A Deployment whose HTTP and HTTPS requests to the internet go through the S3DF HTTP proxy.
# The curl container stands in for your application, for the test in README.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app
  labels:
    app: my-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
        - name: my-app
          image: curlimages/curl:8.13.0
          # Idles, so that you can run curl in it with kubectl exec.
          command: [sh, -c, "sleep infinity"]
          envFrom:
            # http_proxy, https_proxy and no_proxy, in both spellings, from configmap-http-proxy.yaml.
            - configMapRef:
                name: http-proxy
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
