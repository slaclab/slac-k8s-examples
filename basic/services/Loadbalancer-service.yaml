# A LoadBalancer on the S3DF services network, with an address MetalLB picks from the pool.
# Clients outside your vcluster reach my-app at <EXTERNAL-IP>:8080.
apiVersion: v1
kind: Service
metadata:
  name: my-app-lb
  annotations:
    # Required by platform policy: the pool, and so the network, the address comes from.
    metallb.io/address-pool: sdf-services
spec:
  type: LoadBalancer
  # Required by platform policy. Kubernetes defaults it to true, which opens a node port on every node.
  allocateLoadBalancerNodePorts: false
  selector:
    app: my-app
  ports:
    - name: http
      port: 8080
      targetPort: http
