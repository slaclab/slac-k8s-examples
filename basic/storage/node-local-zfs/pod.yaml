# A test pod for pvc.yaml: prints the volume's size and adds one line to /data/runs per run.
# No nodeSelector or node affinity for storage: the PersistentVolume places the pod.
apiVersion: v1
kind: Pod
metadata:
  name: my-app-test
  # If your node pool uses an annotation for its toleration, add it here (see README).
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    # The kubelet gives this group ownership of the volume, so the non-root user can write to it.
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: test
      image: busybox:1.37.0
      command: [sh, -c, "df -h /data && date >> /data/runs && cat /data/runs"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
          ephemeral-storage: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
          ephemeral-storage: 64Mi
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: my-app-data
