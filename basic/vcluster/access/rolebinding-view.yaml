# Read-only access to one namespace (built-in ClusterRole "view": no Secrets, Roles or RoleBindings).
# Apply with -n <namespace>.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: my-colleague-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: my-colleague@slac.stanford.edu
