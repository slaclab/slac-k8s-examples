# The Dex client ID and secret of my-app, from the Vault entry
# secret/my-facility/my-vcluster/my-app/oidc, in Secret my-app-oidc.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: my-app-oidc
  annotations:
    # Exactly "true". The platform then sets secretStoreRef from the first two segments of
    # spec.data[0].remoteRef.key: here ClusterSecretStore my-facility-my-vcluster.
    edu.stanford.slac.sdf.secrets/s3df-vault: "true"
spec:
  refreshInterval: 1h
  target:
    # Always set: the platform copies the Secret back into your vcluster by this name.
    name: my-app-oidc
  data:
    - secretKey: client-id
      remoteRef:
        # <facility>/<vcluster>/<path>, without "secret/" or "data/". The field names are
        # the ones the platform team used when it stored the client.
        key: my-facility/my-vcluster/my-app/oidc
        property: client-id
    - secretKey: client-secret
      remoteRef:
        key: my-facility/my-vcluster/my-app/oidc
        property: client-secret
