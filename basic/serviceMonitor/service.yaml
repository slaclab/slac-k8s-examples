# The Service in front of the application, with a named port.
# The ServiceMonitor selects this Service by its labels and scrapes the port by name.
---
apiVersion: v1
kind: Service
metadata:
  name: my-app
  labels:
    app: my-app  # the ServiceMonitor's selector matches this label
spec:
  selector:
    app: my-app
  ports:
  - name: metrics  # the ServiceMonitor refers to this port by name
    port: 8080
    targetPort: metrics
