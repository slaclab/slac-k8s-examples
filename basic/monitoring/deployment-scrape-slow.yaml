# An expensive exporter scraped every 5 minutes instead of every 30 seconds.
# prometheus.io/scrape_slow replaces prometheus.io/scrape; don't set both.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-exporter
  template:
    metadata:
      labels:
        app: my-exporter
      annotations:
        prometheus.io/scrape_slow: "true"  # 5-minute interval, 30-second timeout
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: my-exporter
          image: quay.io/brancz/prometheus-example-app:v0.5.0
          ports:
            - name: metrics
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
