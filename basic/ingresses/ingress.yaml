# A public Ingress, no login: one approved hostname, every path to the Service my-app.
# No tls: block. The F5 load balancer in front of ingress-nginx serves HTTPS (see README.md).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: my-app
spec:
  ingressClassName: nginx               # the only class; the host cluster sets nginx whatever you write
  rules:
    - host: my-app.slac.stanford.edu    # must be on your vcluster's Ingress allowlist
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: my-app            # your Service, in the same namespace as the Ingress
                port:
                  number: 8080
