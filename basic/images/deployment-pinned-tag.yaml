# A Deployment whose image is pinned to a version tag. With a tag other than latest the
# default imagePullPolicy is IfNotPresent, so a node that has the image starts the pod at once.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app
  labels:
    app: my-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: my-app
          # A version tag, never latest. Spegel answers a tag with the digest the cluster already
          # holds, so a reused tag can keep running old code: change the tag for every new build.
          image: busybox:1.37.0
          imagePullPolicy: IfNotPresent
          command: [httpd, -f, -p, "8080"]
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
