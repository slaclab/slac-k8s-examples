# Guaranteed: every container has CPU and memory requests equal to its limits.
# Under memory pressure it goes only after the pods above their requests. For services that must keep running.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app-guaranteed
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-app-guaranteed
  template:
    metadata:
      labels:
        app: my-app-guaranteed
    spec:
      containers:
        - name: web
          image: busybox:1.37.0
          command: [sh, -c, "mkdir -p /www && echo ok > /www/index.html && exec httpd -f -p 8080 -h /www"]
          ports:
            - containerPort: 8080
              name: http
          # cpu and memory requests equal to the limits make the pod Guaranteed.
          # Ephemeral storage does not affect the QoS class.
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
              ephemeral-storage: 256Mi
