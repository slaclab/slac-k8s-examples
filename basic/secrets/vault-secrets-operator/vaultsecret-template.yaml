# The same Vault entry, reshaped by templates into the environment variables my-app expects.
# The Secret my-app-db-env holds only the templated keys.
apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: my-app-db-env
spec:
  path: secret/my-facility/my-vcluster/my-app/db
  type: Opaque
  # Go templates with {% %} delimiters, not {{ }}. .Secrets holds the keys of the Vault entry;
  # index also works for keys with a dot or a dash, for example {% index .Secrets "admin.password" %}.
  templates:
    DB_USER: '{% index .Secrets "username" %}'
    DB_PASSWORD: '{% index .Secrets "password" %}'
    DB_URL: 'postgresql://{% index .Secrets "username" %}@my-db:5432/my-app'
