# Two keys of the Vault entry secret/my-facility/my-vcluster/my-app/db, copied into the Secret
# my-app-db (the VaultSecret's name) in the same namespace.
apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: my-app-db
spec:
  # The KV path including the secret/ mount. Don't add data/: the operator adds it.
  path: secret/my-facility/my-vcluster/my-app/db
  type: Opaque
  # Only these keys; leave keys out to copy every key. A key that Vault does not have is left
  # out of the Secret without an error.
  keys:
    - username
    - password
