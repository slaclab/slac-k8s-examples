# A Deployment that uses both Secrets: my-app-db-env as environment variables, my-app-db as
# files in /etc/my-app/db.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
        - name: my-app
          image: busybox:1.37.0
          # Lists the key files; it never prints a value.
          command: [sh, -c, "ls /etc/my-app/db && sleep infinity"]
          envFrom:
            - secretRef:
                name: my-app-db-env
          volumeMounts:
            - name: db
              mountPath: /etc/my-app/db
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
      volumes:
        - name: db
          secret:
            secretName: my-app-db
