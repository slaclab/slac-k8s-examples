# Two fields of the Vault entry secret/my-facility/my-vcluster/my-app/db in Secret my-app-db.
# The annotation lets the platform choose the store, so there is no secretStoreRef.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: my-app-db
  annotations:
    # Exactly "true". The platform then sets secretStoreRef from the first two segments of
    # spec.data[0].remoteRef.key: here ClusterSecretStore my-facility-my-vcluster.
    edu.stanford.slac.sdf.secrets/s3df-vault: "true"
spec:
  refreshInterval: 1h
  target:
    # Always set: the platform copies the Secret back into your vcluster by this name.
    name: my-app-db
  data:
    - secretKey: username
      remoteRef:
        # <facility>/<vcluster>/<path>, without "secret/" or "data/".
        key: my-facility/my-vcluster/my-app/db
        property: username
    - secretKey: password
      remoteRef:
        key: my-facility/my-vcluster/my-app/db
        property: password
