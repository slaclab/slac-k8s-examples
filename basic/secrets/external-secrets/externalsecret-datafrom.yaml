# Every field of the Vault entry secret/my-facility/my-vcluster/my-app/env in Secret my-app-env,
# under the field names. With no spec.data the platform cannot choose the store: name it here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: my-app-env
spec:
  refreshInterval: 1h
  secretStoreRef:
    # Your vcluster's store, <facility>-<vcluster>, and no other.
    kind: ClusterSecretStore
    name: my-facility-my-vcluster
  target:
    name: my-app-env
  dataFrom:
    - extract:
        key: my-facility/my-vcluster/my-app/env
