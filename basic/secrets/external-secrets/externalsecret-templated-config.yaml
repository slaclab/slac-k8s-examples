# A config file rendered from Vault values: Secret my-app-config with one key, config.yaml.
# The values come from two entries, my-app/db and my-app/api, both in this vcluster's path.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: my-app-config
  annotations:
    edu.stanford.slac.sdf.secrets/s3df-vault: "true"
spec:
  refreshInterval: 1h
  target:
    name: my-app-config
    template:
      # Only the keys below go into the Secret; username, password and apiToken do not.
      data:
        # {{ .<secretKey> }} is a value from spec.data. toJson quotes and escapes it, so a
        # value with quotes or colons still gives valid YAML.
        config.yaml: |
          database:
            host: my-app-postgres
            port: 5432
            user: {{ .username | toJson }}
            password: {{ .password | toJson }}
          api:
            token: {{ .apiToken | toJson }}
  data:
    - secretKey: username
      remoteRef:
        key: my-facility/my-vcluster/my-app/db
        property: username
    - secretKey: password
      remoteRef:
        key: my-facility/my-vcluster/my-app/db
        property: password
    - secretKey: apiToken
      remoteRef:
        key: my-facility/my-vcluster/my-app/api
        property: token
