# my-app using the Secrets from this directory: environment variables from my-app-db and
# my-app-env, a config file from my-app-config, and an image pulled with my-app-registry.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      imagePullSecrets:
        - name: my-app-registry
      containers:
        - name: my-app
          image: ghcr.io/my-org/my-app:1.0.0
          # Environment variables are read at container start: restart the pods after a change
          # in Vault (kubectl rollout restart deployment/my-app -n my-namespace).
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: my-app-db
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: my-app-db
                  key: password
          envFrom:
            - secretRef:
                name: my-app-env
          volumeMounts:
            # The files follow Vault after each refresh, without a restart. Don't add subPath:
            # a subPath mount never updates.
            - name: config
              mountPath: /etc/my-app
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: config
          secret:
            secretName: my-app-config
