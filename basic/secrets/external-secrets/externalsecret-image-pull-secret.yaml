# An image pull secret for ghcr.io, built from a username and a token in Vault
# (secret/my-facility/my-vcluster/my-app/registry). deployment.yaml uses it in imagePullSecrets.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: my-app-registry
  annotations:
    edu.stanford.slac.sdf.secrets/s3df-vault: "true"
spec:
  refreshInterval: 1h
  target:
    name: my-app-registry
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"username":"{{ .username }}","password":"{{ .token }}","auth":"{{ printf "%s:%s" .username .token | b64enc }}"}}}'
  data:
    - secretKey: username
      remoteRef:
        key: my-facility/my-vcluster/my-app/registry
        property: username
    - secretKey: token
      remoteRef:
        key: my-facility/my-vcluster/my-app/registry
        property: token
