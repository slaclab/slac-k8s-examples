# A Deployment that uses the generated Secret as an environment variable and as files.
# kustomize replaces my-app-db with the generated name, my-app-db-<hash>.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
        - name: my-app
          image: busybox:1.37.0
          # Lists the key files; it never prints a value.
          command: [sh, -c, "ls /etc/my-app/db && sleep infinity"]
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: my-app-db
                  key: username
          volumeMounts:
            - name: db
              mountPath: /etc/my-app/db
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
      volumes:
        - name: db
          secret:
            secretName: my-app-db
