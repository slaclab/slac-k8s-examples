# Generates the Secret my-app-db from the files that the Makefile writes to etc/.secrets/.
# Run it with make apply: on its own, kustomize stops because the files are missing.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml

secretGenerator:
  - name: my-app-db
    type: Opaque
    # One file per key in the Makefile's SECRET_KEYS. The file name becomes the key in the Secret.
    files:
      - etc/.secrets/username
      - etc/.secrets/password

# No generatorOptions.disableNameSuffixHash: the Secret is named my-app-db-<hash of the values>,
# and kustomize puts that name into deployment.yaml. A changed value gives a new name, so the
# Deployment rolls out pods that use it.
