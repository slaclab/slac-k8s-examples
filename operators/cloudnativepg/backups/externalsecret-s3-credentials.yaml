# The S3 access key and secret key for the backup bucket, copied from Vault into Secret
# my-app-db-backup-s3. Needs the External Secrets switch; see basic/secrets/external-secrets.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: my-app-db-backup-s3
  annotations:
    # Exactly "true". The platform then sets secretStoreRef from the first two segments of
    # spec.data[0].remoteRef.key: here ClusterSecretStore my-facility-my-vcluster.
    edu.stanford.slac.sdf.secrets/s3df-vault: "true"
spec:
  refreshInterval: 1h
  target:
    # Always set: the platform copies the Secret back into your vcluster by this name.
    # objectstore.yaml reads keys ACCESS_KEY_ID and ACCESS_SECRET_KEY from it.
    name: my-app-db-backup-s3
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        # <facility>/<vcluster>/<path>, without "secret/" or "data/".
        key: my-facility/my-vcluster/my-app/backup-s3
        property: access-key
    - secretKey: ACCESS_SECRET_KEY
      remoteRef:
        key: my-facility/my-vcluster/my-app/backup-s3
        property: secret-key
