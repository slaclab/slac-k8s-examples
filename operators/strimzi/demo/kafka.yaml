# Kafka 4.0.0 in KRaft mode on the nodes of kafka-nodepool.yaml, reachable only inside your
# vcluster. For clients outside it, apply kafka-external.yaml instead: both define my-kafka.
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: my-kafka
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    # Must be a version the operator release supports: 0.47.0 runs 3.9.0, 3.9.1 and 4.0.0.
    version: 4.0.0
    metadataVersion: 4.0-IV3
    listeners:
      # my-kafka-kafka-bootstrap:9092 inside your vcluster, without TLS.
      - name: plain
        port: 9092
        type: internal
        tls: false
      # my-kafka-kafka-bootstrap:9093, with TLS from the cluster CA.
      - name: tls
        port: 9093
        type: internal
        tls: true
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
    metricsConfig:
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef:
          name: kafka-metrics
          key: kafka-metrics-config.yml
  entityOperator:
    topicOperator:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
    userOperator:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
  cruiseControl:
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
      limits:
        cpu: "1"
        memory: 1Gi
    metricsConfig:
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef:
          name: cruise-control-metrics
          key: metrics-config.yml
