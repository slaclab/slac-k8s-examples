# All privileges for my_app on the database my_app, and on nothing else.
apiVersion: k8s.mariadb.com/v1alpha1
kind: Grant
metadata:
  name: my-app
spec:
  mariaDbRef:
    name: my-db
  privileges:
    - ALL PRIVILEGES
  database: my_app
  table: "*"
  username: my_app
  host: "%"
  grantOption: false
