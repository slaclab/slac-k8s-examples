# One MariaDB instance on Weka, reachable from the SLAC network through MetalLB, with metrics.
# The root and monitoring passwords come from the Secret my-db-users, generated by kustomization.yaml.
apiVersion: k8s.mariadb.com/v1alpha1
kind: MariaDB
metadata:
  name: my-db
spec:
  image: docker-registry1.mariadb.com/library/mariadb:11.4.5
  port: 3306
  rootPasswordSecretKeyRef:
    name: my-db-users
    key: root_password

  storage:
    size: 50Gi
    storageClassName: wekafs--sdf-k8s01
    resizeInUseVolumes: true
    waitForVolumeResize: true

  # The Service my-db. Leave this block out to keep it inside your vcluster (ClusterIP).
  service:
    type: LoadBalancer
    allocateLoadBalancerNodePorts: false
    metadata:
      annotations:
        metallb.io/address-pool: sdf-services
    loadBalancerSourceRanges:
      - 134.79.0.0/16
      - 172.16.0.0/12

  resources:
    requests:
      cpu: "1"
      memory: 4Gi
    limits:
      cpu: "2"
      memory: 4Gi

  # The operator stores this in a ConfigMap it creates; a change rolls the pod.
  myCnf: |
    [mariadb]
    bind-address=*
    default_storage_engine=InnoDB
    binlog_format=row
    innodb_autoinc_lock_mode=2
    innodb_buffer_pool_size=2G
    max_allowed_packet=256M
    max_connections=200

  metrics:
    enabled: true
    exporter:
      image: prom/mysqld-exporter:v0.17.2
      port: 9104
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 500m
          memory: 256Mi
    username: monitoring
    passwordSecretKeyRef:
      name: my-db-users
      key: monitoring_password
