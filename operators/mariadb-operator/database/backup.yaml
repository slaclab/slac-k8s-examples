# A daily logical backup of my-db to a bucket on S3DF object storage, kept for 30 days.
# The access key comes from the Secret my-db-s3, generated by kustomization.yaml.
apiVersion: k8s.mariadb.com/v1alpha1
kind: Backup
metadata:
  name: my-db-backup
spec:
  mariaDbRef:
    name: my-db
  schedule:
    cron: "0 20 * * *"
    suspend: false
  maxRetention: 720h
  storage:
    s3:
      bucket: my-bucket
      prefix: my-db
      endpoint: s3dfrgw.slac.stanford.edu
      accessKeyIdSecretKeyRef:
        name: my-db-s3
        key: access_key
      secretAccessKeySecretKeyRef:
        name: my-db-s3
        key: secret_key
      tls:
        enabled: true
  # Where the dump is written before upload. Without it, an emptyDir on the node's disk.
  stagingStorage:
    persistentVolumeClaim:
      storageClassName: wekafs--sdf-k8s01
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 20Gi
  args:
    - --single-transaction
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
