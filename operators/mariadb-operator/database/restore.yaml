# Restores the newest backup of my-db-backup into my-db. Not in kustomization.yaml: apply it only to restore.
# Add spec.targetRecoveryTime (RFC 3339) to pick the backup closest to that time instead.
apiVersion: k8s.mariadb.com/v1alpha1
kind: Restore
metadata:
  name: my-db-restore
spec:
  mariaDbRef:
    name: my-db
  backupRef:
    name: my-db-backup
  # Where the dump is downloaded before it is restored. Without it, an emptyDir on the node's disk.
  stagingStorage:
    persistentVolumeClaim:
      storageClassName: wekafs--sdf-k8s01
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 20Gi
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 4Gi
