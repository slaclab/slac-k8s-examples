# A two-instance PostgreSQL cluster whose owner credentials come from Vault through the Makefile and
# kustomization.yaml, built on a Rubin image that ships the pg_sphere extension.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: example-db
spec:
  instances: 2
  primaryUpdateStrategy: unsupervised
  # Pinned image with extra extensions (pg_sphere, pg_bulkload, pg_cron, pg_partman), built by Rubin
  # on the upstream CNPG image.
  imageName: ghcr.io/lsst-sqre/cnpg-postgres-images:17.5

  bootstrap:
    initdb:
      database: example
      owner: app
      # Generated by kustomization.yaml from the Vault values. The username in it must be "app",
      # the owner above. When this is set the operator does not create example-db-app.
      secret:
        name: exampledb-creds
      # Runs in the database "example". postInitSQL would run in the postgres database instead.
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS pg_sphere;

  storage:
    # Hard quota: grow it before it fills. Raising size later grows the volume in place.
    storageClass: wekafs--sdf-k8s01
    size: 100Gi
  walStorage:
    storageClass: wekafs--sdf-k8s01
    size: 50Gi

  resources:
    requests:
      cpu: "4"
      memory: 16Gi
    limits:
      cpu: "4"
      memory: 16Gi

  postgresql:
    parameters:
      # shared_buffers about a quarter of the memory limit; with work_mem times max_connections
      # and maintenance_work_mem the total stays inside the 16Gi limit.
      shared_buffers: 4GB
      work_mem: 64MB
      maintenance_work_mem: 1GB
      max_connections: "100"
      max_parallel_workers: "8"
      max_worker_processes: "8"
      # WAL sizes well inside walStorage.size.
      max_wal_size: 8GB
      min_wal_size: 2GB
      wal_keep_size: 4GB
      max_slot_wal_keep_size: 16GB
      random_page_cost: "1.1"
      log_min_duration_statement: 250ms
      log_temp_files: "1"
      pg_stat_statements.max: "10000"
      pg_stat_statements.track: all

  # In seconds: how long a smart shutdown, a whole shutdown and a switchover may take, and how
  # long the operator waits after the primary fails before it fails over to a replica.
  smartShutdownTimeout: 150
  stopDelay: 240
  switchoverDelay: 360
  failoverDelay: 30
