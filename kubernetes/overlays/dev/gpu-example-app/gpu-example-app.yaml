# A single-replica Deployment that holds one GPU, for checking GPU access with kubectl exec.
# It keeps its GPU until you delete it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-example-app
  labels:
    app: gpu-example-app
spec:
  replicas: 1
  # The default rolling update starts the new pod before it stops the old one, so it would need a
  # second free GPU. Recreate stops the old pod first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gpu-example-app
  template:
    metadata:
      labels:
        app: gpu-example-app
    spec:
      # No tolerations: the host adds the GPU toleration because of the nvidia.com/gpu limit.
      containers:
        - name: gpu-example-app
          image: nvcr.io/nvidia/k8s/cuda-sample:vectoradd-cuda11.7.1-ubuntu20.04
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "sleep infinity"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 400m
              memory: 2Gi
              # Whole GPUs, set in limits; Kubernetes sets the request to the same number.
              nvidia.com/gpu: 1
