# ClusterIP Service in front of the relay. Clients connect to my-app-relay:5432.
apiVersion: v1
kind: Service
metadata:
  name: my-app-relay
  labels:
    app: my-app-relay
spec:
  type: ClusterIP
  selector:
    app: my-app-relay
  ports:
    - name: relay
      port: 5432
      targetPort: relay
      protocol: TCP
